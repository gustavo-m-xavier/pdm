version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao_financeira
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./app-gestao-financeira-api
    container_name: backend_api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./app-gestao-financeira-api:/app
      - /app/node_modules
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - mysql

  mobile:
    build:
      context: ./app-gestao-financeira
    container_name: expo_app
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./app-gestao-financeira:/app
      - /app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  mysql_data:
